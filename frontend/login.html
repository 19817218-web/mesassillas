<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Mesas y Sillas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <div class="card-soft auth-card bg-white">
    <div class="text-center mb-3">
      <div class="auth-logo"><i class="bi bi-grid-3x3-gap-fill"></i></div>
      <h1 class="h4 fw-bold mb-0">Mesas y Sillas</h1>
      <div class="text-muted small">Gestión de reservas, préstamos y devoluciones</div>
    </div>
    <ul class="nav nav-pills nav-fill mb-3" id="tabs">
      <li class="nav-item"><button class="nav-link active" data-tab="login" type="button">Ingresar</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="register" type="button">Crear cuenta</button></li>
    </ul>
    <div id="alerta" class="alert alert-danger d-none py-2"></div>

    <form id="formLogin" novalidate>
      <div class="mb-3"><label class="form-label">Correo</label>
        <input type="email" class="form-control" id="lEmail" required autocomplete="username" placeholder="correo@ejemplo.com"></div>
      <div class="mb-3"><label class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="lPass" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100" type="submit" id="btnLogin">Ingresar</button>
      <div class="text-muted small mt-3">Demo: <code>admin@demo.com</code> / <code>Admin123!</code><br>Usuario: <code>ana@demo.com</code> / <code>Usuario123!</code></div>
    </form>

    <form id="formRegister" class="d-none" novalidate>
      <div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control" id="rNombre" required maxlength="120"></div>
      <div class="mb-3"><label class="form-label">Correo</label><input type="email" class="form-control" id="rEmail" required autocomplete="username"></div>
      <div class="mb-3"><label class="form-label">Contraseña (mín. 8 caracteres)</label><input type="password" class="form-control" id="rPass" required minlength="8" autocomplete="new-password"></div>
      <button class="btn btn-success w-100" type="submit" id="btnRegister">Crear cuenta</button>
    </form>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
